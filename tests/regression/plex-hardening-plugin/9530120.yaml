---
meta:
  author: "David Scarth"
  description: "Plex client log message must not trigger 932370"
rule_id: 9530120
tests:
  - test_id: 1
    desc: "Free-text client log line containing a Windows command shape is excluded from 932370 on /log"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/log?level=3&source=Player&message=Error%20opening%20file%3B%20cmd.exe%20%2Fc%20whoami"
        output:
          log:
            no_expect_ids: [932370]
  - test_id: 2
    desc: "Same message parameter on an unrelated path is still inspected (scope control)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/sections?message=Error%20opening%20file%3B%20cmd.exe%20%2Fc%20whoami"
        output:
          log:
            expect_ids: [932370]
