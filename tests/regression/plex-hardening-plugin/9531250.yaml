---
meta:
  author: "David Scarth"
  description: "file path in transcoder preference (CVE-2026-96656)"
# 9531430 (phase 1) also fires on this path. The CI harness is DetectionOnly, so
# nothing interrupts and both IDs are logged; in blocking mode (production)
# the request is dropped in phase 1 and only 9531430 is observable.
rule_id: 9531250
tests:
  - test_id: 1
    desc: "stats= with a path in TranscoderH264Options fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "/:/prefs?TranscoderH264Options=stats%3D%2Fconfig%2Fx.pth"
        output:
          log:
            expect_ids: [9531250]
  - test_id: 2
    desc: "tcfile-out= with a path fires without naming the option"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "/:/prefs?TranscoderH264Options=tcfile-out%3D%2Fconfig%2Fx.pth"
        output:
          log:
            expect_ids: [9531250]
  - test_id: 3
    desc: "Backslash (Windows path) in TranscoderH264OptionsOverride fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "/:/prefs?TranscoderH264OptionsOverride=stats%3DC%3A%5Cplex%5Cx.pth"
        output:
          log:
            expect_ids: [9531250]
  - test_id: 4
    desc: "Newline in the value fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "/:/prefs?TranscoderH264OptionsOverride=ref%3D2%0Aimport%20os"
        output:
          log:
            expect_ids: [9531250]
  - test_id: 5
    desc: "Legitimate x264 tuning does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "/:/prefs?TranscoderH264Options=ref%3D2%3Abframes%3D3%3Ame%3Dumh"
        output:
          log:
            no_expect_ids: [9531250]
  - test_id: 6
    desc: "Path in an unrelated preference does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "/:/prefs?TranscoderTempDirectory=%2Ftmp%2Fplex"
        output:
          log:
            no_expect_ids: [9531250]
  - test_id: 7
    desc: "repeated slashes in the path (no normalizing transform) still reach the rule"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "//:/prefs?TranscoderH264Options=%2Ftmp%2Fx"
        output:
          log:
            expect_ids: [9531250]
  - test_id: 8
    desc: "trailing slash on the endpoint path still reaches the rule"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: PUT
          uri: "/:/prefs/?TranscoderH264Options=stats%3D%2Fconfig%2Fx.pth"
        output:
          log:
            expect_ids: [9531250]
