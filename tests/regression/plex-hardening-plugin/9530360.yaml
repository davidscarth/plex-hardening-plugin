---
meta:
  author: "David Scarth"
  description: "X-Plex-Url header deny (CVE-2014-9304)"
rule_id: 9530360
tests:
  - test_id: 1
    desc: "X-Plex-Url on an ordinary shared-client path fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            X-Plex-Url: http://169.254.169.254/latest/meta-data/
          port: 80
          method: GET
          uri: "/library/sections"
        output:
          log:
            expect_ids: [9530360]
  - test_id: 2
    desc: "X-Plex-Url on /system/proxy logs alongside the path deny; lowercase header name proves case-insensitive matching (both IDs log only in DetectionOnly, as in the shared harness; a blocking engine stops at 9530350)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            x-plex-url: http://127.0.0.1:32400/:/prefs
          port: 80
          method: GET
          uri: "/system/proxy"
        output:
          log:
            expect_ids: [9530350, 9530360]
  - test_id: 3
    desc: "Ordinary X-Plex-* client headers do not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            X-Plex-Token: abcdef123456
            X-Plex-Client-Identifier: 0123456789abcdef
            X-Plex-Product: Plex for iOS
          port: 80
          method: GET
          uri: "/library/sections"
        output:
          log:
            no_expect_ids: [9530360]
