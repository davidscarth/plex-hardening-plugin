---
meta:
  author: "David Scarth"
  description: "unsupported media reference on metadata file endpoint (allowlist)"
rule_id: 9530280
tests:
  - test_id: 1
    desc: "http:// reference fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/metadata/1234/file?url=http%3A%2F%2Fexample.org%2Fx"
        output:
          log:
            expect_ids: [9530280]
  - test_id: 2
    desc: "gopher:// reference fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/metadata/1234/file?url=gopher%3A%2F%2F127.0.0.1%3A32400%2F_"
        output:
          log:
            expect_ids: [9530280]
  - test_id: 3
    desc: "bare path fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/metadata/1234/file?url=%2Fetc%2Fpasswd"
        output:
          log:
            expect_ids: [9530280]
  - test_id: 4
    desc: "media:// reference does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/metadata/1234/file?url=media%3A%2F%2Fparts%2F5678%2Ffile.mkv"
        output:
          log:
            no_expect_ids: [9530280]
  - test_id: 5
    desc: "metadata:// artwork reference does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/metadata/1234/file?url=metadata%3A%2F%2Fposters%2Fcom.plexapp.agents.imdb_abc"
        output:
          log:
            no_expect_ids: [9530280]
  - test_id: 6
    desc: "Other endpoint with a non-media url is not this rule's job"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/photo/:/transcode?url=http%3A%2F%2F127.0.0.1%3A32400%2Fx"
        output:
          log:
            no_expect_ids: [9530280]
