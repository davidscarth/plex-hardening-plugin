---
meta:
  author: "David Scarth"
  description: "URL scheme in transcoder path parameter (CVE-2026-96655)"
rule_id: 9531230
tests:
  - test_id: 1
    desc: "External http URL in path= fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/video/:/transcode/universal/start.m3u8?path=http%3A%2F%2F169.254.169.254%2Flatest%2Fmeta-data%2F"
        output:
          log:
            expect_ids: [9531230]
  - test_id: 2
    desc: "file scheme in path= fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/video/:/transcode/universal/decision?path=file%3A%2F%2F%2Fetc%2Fpasswd"
        output:
          log:
            expect_ids: [9531230]
  - test_id: 3
    desc: "Loopback URL in path= also fires (clients never send a scheme)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/music/:/transcode/universal/start.mp3?path=HTTP%3A%2F%2F127.0.0.1%3A32400%2Flibrary%2Fmetadata%2F1"
        output:
          log:
            expect_ids: [9531230]
  - test_id: 4
    desc: "Protocol-relative //host/path fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/video/:/transcode/universal/start.m3u8?path=%2F%2Fevil.example%2Fx"
        output:
          log:
            expect_ids: [9531230]
  - test_id: 5
    desc: "Bare library key does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/video/:/transcode/universal/start.m3u8?path=%2Flibrary%2Fmetadata%2F1234"
        output:
          log:
            no_expect_ids: [9531230]
  - test_id: 6
    desc: "Scheme in path= on the photo transcoder is out of scope"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/photo/:/transcode?path=http%3A%2F%2Fexample.org%2F"
        output:
          log:
            no_expect_ids: [9531230]
  - test_id: 7
    desc: "repeated slashes in the path (no normalizing transform) still reach the rule"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "//video/:/transcode/universal/decision?path=http%3A%2F%2F10.0.0.5%2Fx"
        output:
          log:
            expect_ids: [9531230]
