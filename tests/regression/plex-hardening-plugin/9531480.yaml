---
meta:
  author: "David Scarth"
  description: "write method on a client-polled endpoint (GET, HEAD, OPTIONS allowed, all else denied)"
rule_id: 9531480
tests:
  - test_id: 1
    desc: "DELETE /activities/{id} fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: DELETE
          uri: "/activities/2d1c6a7e-4b3f-4c1e-9a8d-0f1e2d3c4b5a"
        output:
          log:
            expect_ids: [9531480]
  - test_id: 2
    desc: "POST /activities fires (no such Plex verb; deny anyway)"
    stages:
