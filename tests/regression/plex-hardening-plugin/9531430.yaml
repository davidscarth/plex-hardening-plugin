---
meta:
  author: "David Scarth"
  description: "server management endpoints deny"
rule_id: 9531430
tests:
  - test_id: 1
    desc: "/:/prefs fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/:/prefs"
        output:
          log:
            expect_ids: [9531430]
  - test_id: 2
    desc: "/updater/check fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
