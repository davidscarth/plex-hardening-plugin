  - test_id: 6
    desc: "Query string after a denied path still fires (REQUEST_URI anchor)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/:/prefs?X-Plex-Token=abc"
        output:
          log:
            expect_ids: [9531430]
  - test_id: 7
    desc: "GET /updater/status is allowed (polled by Plex Web; 403 from Plex to shared tokens)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/updater/status?X-Plex-Product=Plex%20Web"
        output:
          log:
            no_expect_ids: [9531430]
  - test_id: 8
