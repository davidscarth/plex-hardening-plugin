---
meta:
  author: "David Scarth"
  description: "Plex Web UI deny"
rule_id: 9530310
tests:
  - test_id: 1
    desc: "/web/index.html fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/web/index.html"
        output:
          log:
            expect_ids: [9530310]
  - test_id: 2
    desc: "Uppercase /WEB fires (lowercase transform)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/WEB/index.html"
        output:
          log:
            expect_ids: [9530310]
  - test_id: 3
    desc: "/web with a query string fires (REQUEST_URI anchor)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/web?x=1"
        output:
          log:
            expect_ids: [9530310]
  - test_id: 4
    desc: "/webhooks-lookalike prefix is not matched"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/webhooks"
        output:
          log:
            no_expect_ids: [9530310]
