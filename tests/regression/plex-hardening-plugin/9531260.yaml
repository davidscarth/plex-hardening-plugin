---
meta:
  author: "David Scarth"
  description: "path characters in agent identifier (CVE-2026-96654)"
# 9531440 (phase 1) also fires on this path. The CI harness is DetectionOnly, so
# nothing interrupts and both IDs are logged; in blocking mode (production)
# the request is dropped in phase 1 and only 9531440 is observable.
rule_id: 9531260
tests:
  - test_id: 1
    desc: "Slash-delimited route in identifier fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/system/agents/config?identifier=com.plexapp.agents.localmedia%2Fpath%2Fto%2Frpc"
        output:
          log:
            expect_ids: [9531260]
  - test_id: 2
    desc: "Fragment in identifier fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/system/agents/config?identifier=com.plexapp.agents.localmedia%23frag"
        output:
          log:
            expect_ids: [9531260]
  - test_id: 3
    desc: "Traversal in identifier fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/system/agents/config?identifier=..%2F..%2Fx"
        output:
          log:
            expect_ids: [9531260]
  - test_id: 4
    desc: "Well-formed identifier does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/system/agents/config?identifier=tv.plex.agents.movie"
        output:
          log:
            no_expect_ids: [9531260]
  - test_id: 5
    desc: "Same parameter on another path is out of scope"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/sections?identifier=a%2Fb"
        output:
          log:
            no_expect_ids: [9531260]
  - test_id: 6
    desc: "identifier on the base path (no subpath) fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/system/agents?identifier=com.plexapp.agents.localmedia%2F..%2Frpc"
        output:
          log:
            expect_ids: [9531260]
  - test_id: 7
    desc: "Bare agent list without identifier does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/system/agents"
        output:
          log:
            no_expect_ids: [9531260]
  - test_id: 8
    desc: "repeated slashes in the path (no normalizing transform) still reach the rule"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "//system//agents/config?identifier=a%2Fb"
        output:
          log:
            expect_ids: [9531260]
