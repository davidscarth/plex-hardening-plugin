---
meta:
  author: "David Scarth"
  description: "path or delimiter in Companion subscribe host= (CVE-2026-96652, plex2shell)"
rule_id: 9531310
tests:
  - test_id: 1
    desc: "loopback host carrying a path and fragment fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/player/timeline/subscribe?protocol=http&host=127.0.0.1:32400/system/agents/x%23&port=32400&commandID=1"
        output:
          log:
            expect_ids: [9531310]
  - test_id: 2
    desc: "slash in host= fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/player/timeline/subscribe?protocol=http&host=a/b&port=32400&commandID=1"
        output:
          log:
            expect_ids: [9531310]
  - test_id: 3
    desc: "plain IPv4 host with a numeric port does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/player/timeline/subscribe?protocol=http&host=192.168.1.50&port=32500&commandID=1"
        output:
          log:
            no_expect_ids: [9531310]
  - test_id: 4
    desc: "plain hostname with the Plex port does not fire"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/player/timeline/subscribe?protocol=http&host=player.local&port=32400&commandID=1"
        output:
          log:
            no_expect_ids: [9531310]
  - test_id: 5
    desc: "same bad host= on another endpoint is out of scope"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/library/sections?host=127.0.0.1:32400/system/agents/x%23&port=32400"
        output:
          log:
            no_expect_ids: [9531310]
  - test_id: 6
    desc: "slash in host= on the proxy subscribe route fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/player/proxy/subscribe?protocol=http&host=a/b&port=32400&commandID=1"
        output:
          log:
            expect_ids: [9531310]
  - test_id: 7
    desc: "backslash in host= fires"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/player/timeline/subscribe?protocol=http&host=a%5Cb&port=32400&commandID=1"
        output:
          log:
            expect_ids: [9531310]
