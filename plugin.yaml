# OWASP CRS Plugin Descriptor
# See https://github.com/coreruleset/plugin-registry for the schema definition.

schema_version: 1

plugin:
  name: "plex-hardening-plugin"
  description: "Hardening for Plex Media Server behind OWASP CRS: required rule exclusions, CVE detection rules and owner-only endpoint denies."
  long_description: |
    Includes the rule exclusions Plex needs to run behind CRS at all (the
    WAF otherwise breaks playback and search at paranoia level 1), plus
    detection rules for CVE-2026-96651, -96652, -96654, -96655, -96656 and
    the Zenofex Plex_Vuln_PoCs classes, and optional phase-1 denies for
    owner-only management endpoints (/web, /myplex, /:/prefs, /system/agents,
    /system/proxy, ...) on a reverse proxy that serves shared users' clients
    only. Written after a 2026 stolen-token incident on a live Plex server.
  type: "3rd-party"
  category: "protection"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "David Scarth"
      url: "https://github.com/davidscarth"
  repository: "https://github.com/davidscarth/plex-hardening-plugin"
  keywords:
    - "plex"
    - "media server"
    - "hardening"
    - "rule exclusions"
    - "ssrf"
    - "lfi"

rule_id_range:
  start: 9530000
  end: 9530999

compatibility:
  crs_version: ">=4.25.1"

configuration:
  file: "plugins/plex-hardening-config.conf"
  variables:
    - name: "tx.plex-hardening-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enables or disables the plugin (0 to disable)."
      required: false
    - name: "tx.plex-hardening-plugin_endpoint_deny_enabled"
      type: "boolean"
      default: 1
      description: "Drop requests to owner-only Plex management endpoints (rules 9530300-9530399)."
      required: false
    - name: "tx.plex-hardening-plugin_xfh_tripwire_enabled"
      type: "boolean"
      default: 0
      description: "Log a WARNING-scored event when a client supplies X-Forwarded-Host (first-hop proxies only)."
      required: false
