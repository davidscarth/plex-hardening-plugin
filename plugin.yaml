# OWASP CRS Plugin Descriptor
# See https://github.com/coreruleset/plugin-registry for the schema definition.

schema_version: 1

plugin:
  name: "plex-hardening-plugin"
  description: "Detection rules and endpoint denies for operations and surfaces no remote client needs, for Plex Media Server behind OWASP CRS. Requires plex-rule-exclusions-plugin."
  long_description: |
    Detection rules for CVE-2026-96651, -96652, -96654, -96655, -96656 and
    the Zenofex Plex_Vuln_PoCs classes, and optional phase-1 denies for
    operations and surfaces no remote client needs, chiefly owner-only
    management (/web, /myplex, /:/prefs, /system/agents, /system/proxy, ...)
    on a reverse proxy that serves shared users' clients only. Written after
    a 2026 stolen-token incident on a live Plex server.
  type: "3rd-party"
  category: "protection"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "David Scarth"
      url: "https://github.com/davidscarth"
  repository: "https://github.com/davidscarth/plex-hardening-plugin"
  keywords:
    - "plex"
    - "media server"
    - "hardening"
    - "ssrf"
    - "lfi"

rule_id_range:
  start: 9531000
  end: 9531999

dependencies:
  - name: "plex-rule-exclusions-plugin"

compatibility:
  crs_version: ">=4.25.2"

configuration:
  file: "plugins/plex-hardening-config.conf"
  variables:
    - name: "tx.plex-hardening-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enables or disables the plugin (0 to disable)."
      required: false
    - name: "tx.plex-hardening-plugin_endpoint_deny_enabled"
      type: "boolean"
      default: 1
      description: "Drop requests for operations and surfaces no remote client needs, chiefly owner-only Plex management endpoints (rules 9531400-9531499)."
      required: false
    - name: "tx.plex-hardening-plugin_hosts"
      type: "list"
      separator: " "
      prefix: "/"
      suffix: "/"
      description: "Space-separated, slash-wrapped scope entries the plugin applies to: /name/, /name:port/, /ip:port/ or /:port/. Unset applies the plugin to every request; set it only when the WAF also fronts other applications."
      required: false
      example: "/plex.example.com/"
    - name: "tx.plex-hardening-plugin_xfh_tripwire_enabled"
      type: "boolean"
      default: 0
      description: "Log a WARNING-scored event when a client supplies X-Forwarded-Host (first-hop proxies only)."
      required: false
