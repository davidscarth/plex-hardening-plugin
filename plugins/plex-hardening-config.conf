# OWASP CRS Plugin
# Plugin name: plex-hardening-plugin
# Plugin description: Detection rules for Plex-specific attack classes and
#                     endpoint denies for operations and surfaces no remote
#                     client needs, chiefly owner-only management, on a
#                     shared-client proxy.
#                     Requires plex-rule-exclusions-plugin.
# Rule ID block: 9,531,000-9,531,999
# Plugin version: 1.0.0

# Documentation can be found here:
# https://github.com/davidscarth/plex-hardening-plugin

# Generic rule to disable the plugin
#
# Plugins are enabled by default.
#
# They become active by placing them in the plugin folder. It is possible to
# control plugin activation via setting a variable. This can be done in the
# plugin config file here.
#
# The predefined variable name is meant to be "<plugin name>-plugin_enabled".
# For the plex-hardening-plugin, this means it can be disabled by setting
# tx.plex-hardening-plugin_enabled=0.
#
# Note that a global setting of this variable overrides the setting here.
# That means the "enabled" variable is only set by this rule if it has not
# been set before.
#
#SecRule &TX:plex-hardening-plugin_enabled "@eq 0" \
#  "id:9531010,\
#   phase:1,\
#   pass,\
#   nolog,\
#   setvar:'tx.plex-hardening-plugin_enabled=0'"

# Plugin configuration variables
#
# Defaults are set in plex-hardening-before.conf and only apply when the
# variable has not been set before, so uncommenting a line here overrides
# the default.

# Endpoint denies (rules 9531400-9531499)
#
# Default: 1 (deny). These rules DROP requests for operations and surfaces
# no remote client needs: chiefly Plex management endpoints that the owner
# administers on localhost or the LAN rather than through this proxy, plus
# the server-hosted web UI (remote clients use app.plex.tv) and the
# deprecated request proxy. Uncomment and set the below to 0 if you
# administer Plex through the proxied hostname (Plex Web, remote updates,
# tuner setup). Detection rules stay active either way.
#
#SecAction \
#  "id:9531020,\
#   phase:1,\
#   nolog,\
#   pass,\
#   setvar:'tx.plex-hardening-plugin_endpoint_deny_enabled=0'"

# Edge X-Forwarded-Host tripwire (rule 9531270)
#
# Default: 0 (off). Scores WARNING. When this WAF is the first hop, a
# client-supplied X-Forwarded-Host has no legitimate origin and is a
# reconnaissance indicator. Opt-in, because any upstream proxy or CDN that
# sets the header will trip it on every request. Uncomment below to enable.
#
#SecAction \
#  "id:9531021,\
#   phase:1,\
#   nolog,\
#   pass,\
#   setvar:'tx.plex-hardening-plugin_xfh_tripwire_enabled=1'"

# Trusted-source allowlist (rule 9531022)
#
# Default: commented (no exemptions). Requests from the listed addresses or
# networks skip the endpoint denies (9531400-9531499), so the owner can use
# Settings and library administration through the proxy from a known
# address (a VPN egress, the LAN). Detection rules still apply.
# @ipMatch cannot read a variable, so this is edited in place rather than
# set as a tx. knob. IPv4 and IPv6 CIDRs are accepted, comma-separated.
# The example ranges are documentation addresses (RFC 5737, RFC 3849) and
# match nothing real; replace them before uncommenting.
#
#SecRule REMOTE_ADDR "@ipMatch 192.0.2.0/24,2001:db8::/32" \
#  "id:9531022,\
#   phase:1,\
#   pass,\
#   nolog,\
#   ctl:ruleRemoveById=9531400-9531499"

# Scope: hosts and/or ports this plugin applies to (rule 9531023)
#
# Leave unset (the default) when this WAF fronts only Plex, however Plex is
# reached (domain, dynamic-DNS name, bare IP): the plugin then applies to
# every request. Set it only when the same WAF pipeline also fronts other
# applications. Entries are wrapped in slashes and separated by spaces;
# use the least specific form that tells Plex apart:
#
#   /plex.example.com/        this name on any port
#   /plex.example.com:8443/   this name on this port only
#   /203.0.113.5:8443/        this IP on this port
#   /:8443/                   any name or IP on this listening port
#                             (several apps on a dynamic IP, one per port)
#   /[2001:db8::1]/           IPv6 literals keep their brackets
#
# The port in an entry is the port THIS server accepted the request on
# (SERVER_PORT), not the Host header's: the public port when the WAF
# terminates TLS, the forwarded port behind a separate TLS terminator.
#
# Names are matched case-insensitively. A request matching any entry gets
# the plugin; anything else is left to plain CRS. A wrong value silently
# disables the plugin for Plex, so check the log for plugin rule IDs after
# setting it. Set your hostname and uncomment below to enable.
#
#SecAction \
#  "id:9531023,\
#   phase:1,\
#   nolog,\
#   pass,\
#   setvar:'tx.plex-hardening-plugin_hosts=/plex.example.com/'"
