# OWASP CRS Plugin
# Plugin name: plex-hardening-plugin
# Plugin description: Detection rules for Plex-specific attack classes and
#                     owner-only endpoint denies for a shared-client proxy.
#                     Requires plex-rule-exclusions-plugin.
# Rule ID block: 9,531,000-9,531,999
# Plugin version: 1.0.0

# Documentation can be found here:
# https://github.com/davidscarth/plex-hardening-plugin

# Generic rule to disable plugin
SecRule TX:plex-hardening-plugin_enabled "@eq 0" "id:9531099,phase:1,pass,nolog,ctl:ruleRemoveById=9531100-9531999"

# Default values for configuration variables (see -config file). Each is
# only set when the variable does not exist yet, so the config file wins.
SecRule &TX:plex-hardening-plugin_endpoint_deny_enabled "@eq 0" "id:9531030,phase:1,pass,nolog,setvar:'tx.plex-hardening-plugin_endpoint_deny_enabled=1'"
SecRule &TX:plex-hardening-plugin_xfh_tripwire_enabled "@eq 0" "id:9531031,phase:1,pass,nolog,setvar:'tx.plex-hardening-plugin_xfh_tripwire_enabled=0'"

# Scoping (see -config file). Active only when
# tx.plex-hardening-plugin_hosts is set: three tokens (/name/,
# /name:port/, /:port/) are built from the Host header and SERVER_PORT, and
# every plugin rule is removed unless one of them is in the list. A request
# with no Host header keeps the plugin (over-applying is the safe direction).
#
# 9531089  default the flag to "apply"
# 9531090  build the tokens and reset the flag, only once a Host is parsed
# 9531091-9531093  set the flag if a token is listed
# 9531096  remove the plugin if the list is set and no token matched
SecRule &TX:plex-hardening-plugin_hosts "@gt 0" \
    "id:9531089,phase:1,pass,nolog,t:none,setvar:'tx.plex-hardening-plugin_scope_ok=1'"

SecRule &TX:plex-hardening-plugin_hosts "@gt 0" \
    "id:9531090,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_HEADERS:Host "@rx ^(\[[^\]]+\]|[^:]+)" \
        "t:none,t:lowercase,\
        capture,\
        setvar:'tx.plex-hardening-plugin_scope_ok=0',\
        setvar:'tx.plex-hardening-plugin_tok_name=/%{TX.1}/',\
        setvar:'tx.plex-hardening-plugin_tok_nameport=/%{TX.1}:%{SERVER_PORT}/',\
        setvar:'tx.plex-hardening-plugin_tok_port=/:%{SERVER_PORT}/'"

SecRule TX:plex-hardening-plugin_tok_name "@within %{tx.plex-hardening-plugin_hosts}" \
    "id:9531091,phase:1,pass,nolog,t:none,setvar:'tx.plex-hardening-plugin_scope_ok=1'"
SecRule TX:plex-hardening-plugin_tok_nameport "@within %{tx.plex-hardening-plugin_hosts}" \
    "id:9531092,phase:1,pass,nolog,t:none,setvar:'tx.plex-hardening-plugin_scope_ok=1'"
SecRule TX:plex-hardening-plugin_tok_port "@within %{tx.plex-hardening-plugin_hosts}" \
    "id:9531093,phase:1,pass,nolog,t:none,setvar:'tx.plex-hardening-plugin_scope_ok=1'"

SecRule &TX:plex-hardening-plugin_hosts "@gt 0" \
    "id:9531096,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule TX:plex-hardening-plugin_scope_ok "!@eq 1" \
        "t:none,\
        ctl:ruleRemoveById=9531100-9531999"

# Sub-gate: owner-only endpoint denies
SecRule TX:plex-hardening-plugin_endpoint_deny_enabled "@eq 0" "id:9531098,phase:1,pass,nolog,ctl:ruleRemoveById=9531400-9531499"


# ------------------------------------------------------------------------
# Layout
# ------------------------------------------------------------------------
#
#   9531000-9531099  Initialization (switches, config, scope, gates).
#   9531100-9531199  Unassigned (the exclusions plugin uses 9530100-9530199;
#                    the two merge by suffix).
#   9531200-9531399  Detection rules: phase 2, anomaly-scored like CRS rules
#                    (in a -before file phase 1 runs before CRS 901 defines
#                    the scores), honoring SecDefaultAction via "block".
#   9531400-9531499  Owner-only endpoint denies: explicit "drop" in phase 1,
#                    independent of scoring. For a 403 instead, add to your
#                    after-file:
#                    SecRuleUpdateActionById 9531400-9531499 "deny,status:403"
#   9531500-9531999  Reserved for response rules (CRS plugin convention).
#
# All regexes are RE2-compatible (no lookaround, no backreferences) so the
# plugin runs unchanged on Coraza's default Go regexp engine and on
# ModSecurity/PCRE.
#
# Context: the post-incident review of a 2026 shared-user token compromise
# (five blocked owner-escalation attempts over three weeks) and the Zenofex
# Plex_Vuln_PoCs analysis.
# Plex Media Server >= 1.43.4 patches every CVE referenced below; the
# detection rules are defense-in-depth against regressions and variants.


# ========================================================================
# Detection rules
# ========================================================================

# ------------------------------------------------------------------------
# 9531200  file:// scheme in a url parameter
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96651 / Zenofex metadata-file-read (CWE-36, CWE-73).
# /library/metadata/{id}/file accepts url=; legitimate requests use
# media:// references. Vulnerable builds accepted file:// and returned
# arbitrary server-side files (Preferences.xml, .LocalAdminToken, the
# library DB). Any valid session token was enough.
#
# CRS gap: 931130 covers file:// but is PL2. 931100 (PL1) requires an IP
# literal after the scheme, so file:///path passes.
#
# Deliberately not scoped to the metadata endpoint: the photo transcoder
# (/photo/:/transcode?url=) is the same fetch-a-URL class, and exclusions
# 9530110 removes ARGS:url from 931100/934110 there for loopback URLs.
#
SecRule ARGS:url "@rx (?i)^\s*file:" \
    "id:9531200,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: file:// scheme in url parameter (CVE-2026-96651, metadata-file-read)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531210  Traversal inside a media:// reference on the metadata file endpoint
# ------------------------------------------------------------------------
#
# The exact shape seen in the incident that produced this plugin (five
# attempts over three weeks, all caught by 930100):
#   GET /library/metadata/{id}/file?url=media://../../Preferences.xml
# A Plex-labeled backstop, so the event is attributable even if 930100 is
# ever excluded on this path, and can drive a CrowdSec scenario on one ID.
#
SecRule REQUEST_FILENAME "@rx ^/+library/+metadata/+[0-9]+/+file/*$" \
    "id:9531210,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: path traversal in metadata file reference (CVE-2026-96651, observed in the wild)',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:url "@rx (?:^|[\x5c/])\.\.(?:[\x5c/]|$)" \
        "t:none,t:urlDecodeUni,\
        setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531220  Encode/decode flag injection in a client profile augmentation
# ------------------------------------------------------------------------
#
# Addresses: Zenofex profile-extra-rce (CWE-88, CWE-94, CWE-73).
# X-Plex-Client-Profile-Extra accepts add-transcode-target-settings()
# directives. Vulnerable builds allowed VideoEncodeFlags to inject
# arbitrary FFmpeg/x264 arguments, giving .pth placement and delayed RCE
# as the Plex service account. Plex's fix is an allowlist whose contents
# are not visible from outside, so every setting ending in Flags is matched
# rather than the four known names.
#
# CRS gap: the 932 family inspects ARGS and cookies, not custom headers.
# Plex accepts X-Plex-* in either position, so both are inspected here.
# Exclusions 9530100 removes ARGS:X-Plex-Client-Profile-Extra from 932235
# and 932370 only; this rule is unaffected.
#
SecRule REQUEST_HEADERS:X-Plex-Client-Profile-Extra|ARGS:X-Plex-Client-Profile-Extra "@rx (?i)\w*flags=" \
    "id:9531220,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: encode/decode flag injection in client profile augmentation (profile-extra-rce)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-rce',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/152/248/88',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531230  URL scheme in the transcoder path parameter
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96655. /video/:/transcode/universal accepted a full
# URL in the path parameter and fetched it (SSRF). Fixed in 10861.
# Legitimate clients always pass a library reference (/library/metadata/{id},
# /library/parts/...), never a scheme. Any scheme here is an attack, and
# so is a protocol-relative reference (//host/path), which has no scheme
# but still names a remote host.
#
SecRule REQUEST_FILENAME "@rx ^/+(?:video|music|audio|subtitles)/+:/+transcode/+universal/+" \
    "id:9531230,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: URL scheme in transcoder path parameter (CVE-2026-96655)',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/225/115/664',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:path "@rx ^(?:[a-z][a-z0-9+.-]*:|/)/" \
        "t:none,t:urlDecodeUni,t:lowercase,\
        setvar:'tx.rfi_score=+%{tx.critical_anomaly_score}',\
            setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531240  Non-http(s) protocol on Companion subscribe
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96652 / Zenofex companion-proxy-ssrf (CWE-918).
# /player/timeline/subscribe takes protocol=http or protocol=https and
# nothing else; Plex's 10861 fix enforces exactly that ("wanted to
# subscribe with an unsupported protocol '%s'"). The SSRF put a full URL
# here. /player/* stays open for Companion traffic; only this parameter's
# shape is enforced. protocol=dash / protocol=hls on the transcoder is
# out of scope by the exact path match.
#
SecRule REQUEST_FILENAME "@rx ^/+player/+timeline/+subscribe/*$" \
    "id:9531240,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: non-http(s) protocol on Companion subscribe (CVE-2026-96652, companion-proxy-ssrf)',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/225/115/664',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:protocol "!@rx ^https?$" \
        "t:none,t:urlDecodeUni,t:lowercase,\
        setvar:'tx.rfi_score=+%{tx.critical_anomaly_score}',\
            setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531250  File-write shape in a transcoder preference
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96656 / Zenofex network-transcoder-preference and
# the legacy-pth-rce chain. TranscoderH264Options is appended verbatim to
# x264's option string. The PoC used stats= (names an output file) plus a
# newline to inject a second line, which is how the .pth payload is
# placed; tcfile-out= and other options also name files. Rather than
# enumerate option names, any path separator or line break in the value
# is blocked: no legitimate x264 tuning value (ref=2:bframes=3) contains
# / or \, only options that name files do.
#
# Backstop for /:/prefs, which 9531430 drops when endpoint denies are on;
# active protection on deployments without the deny.
#
SecRule REQUEST_FILENAME "@rx ^/+:/+prefs/*$" \
    "id:9531250,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: file-write shape in transcoder preference (CVE-2026-96656, network-transcoder-preference)',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-rce',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/152/248/88',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:/^Transcoder.*Options(?:Override)?$/ "@rx [/\x5c\r\n]" \
        "t:none,t:urlDecodeUni,\
        setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531260  Path characters in an agent identifier
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96654 / Zenofex framework-rpc-injection and the
# legacy-pth-rce chain. Agent identifiers are reverse-DNS names
# (com.plexapp.agents.localmedia, tv.plex.agents.movie): letters, digits,
# dots. The RPC injection put a slash-delimited route and a # fragment in
# the identifier parameter; the legacy chain put ../ in it.
#
# Matches the base path as well as subpaths: the chain requires
# ARGS:identifier, so the bare agent list is never affected.
# Backstop for /system/agents, which 9531440 drops when endpoint denies
# are on (the endpoint answers without a token).
#
SecRule REQUEST_FILENAME "@rx ^/+system/+agents(?:/|$)" \
    "id:9531260,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: path characters in agent identifier (CVE-2026-96654, framework-rpc-injection)',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-injection-generic',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/152/137/6',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:identifier "@rx [/\x5c#]" \
        "t:none,t:urlDecodeUni,\
        setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531270  Forwarding header at the edge (opt-in detection signal)
# ------------------------------------------------------------------------
#
# At a first-hop proxy nothing legitimate sets X-Forwarded-Host on inbound
# requests; presence means a client is probing with proxy-header spoofing.
# Scores WARNING (3 by default): below the blocking threshold on its own,
# visible in logs, usable as an alerting signal.
#
# X-Forwarded-For is deliberately not matched: some VPN and proxy services
# inject it on ordinary traffic and a shared user behind one would be hit.
#
# Opt-in: tx.plex-hardening-plugin_xfh_tripwire_enabled=1 (-config file).
# Tests header presence, so an empty X-Forwarded-Host still trips it.
#
SecRule TX:plex-hardening-plugin_xfh_tripwire_enabled "@eq 1" \
    "id:9531270,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: X-Forwarded-Host supplied by client at edge proxy',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-protocol',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/118/169',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING',\
    chain"
    SecRule &REQUEST_HEADERS:X-Forwarded-Host "@gt 0" \
        "t:none,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# ------------------------------------------------------------------------
# 9531280  Unsupported media reference on the metadata file endpoint
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96651 / Zenofex metadata-file-read, allowlist form.
# Plex's 10896 fix logs "[Library] Rejecting metadata file request for
# unsupported media reference: %s", i.e. the endpoint only accepts Plex's
# own reference schemes. Anything else (file:, http:, gopher:, a bare
# path) is rejected here regardless of what 9531200/9531210 catch.
#
# Untested against production traffic as of this release; see README.
# media:// is the reference seen in client traffic on this endpoint;
# metadata:// and upload:// are Plex's other bundle-reference schemes and
# are included so artwork references are not blocked. Trim if your traffic
# shows only media://.
#
SecRule REQUEST_FILENAME "@rx ^/+library/+metadata/+[0-9]+/+file/*$" \
    "id:9531280,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: unsupported media reference on metadata file endpoint (CVE-2026-96651, metadata-file-read)',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:url "!@rx (?i)^(?:media|metadata|upload)://" \
        "t:none,t:urlDecodeUni,t:trim,\
        setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ------------------------------------------------------------------------
# 9531290  Reference to a Plex secrets file
# ------------------------------------------------------------------------
#
# Addresses: any file-read path to the server's credentials, independent of
# how the read is smuggled. Preferences.xml holds PlexOnlineToken (full
# account access; Linux, macOS and NAS installs, Windows keeps preferences
# in the registry); .LocalAdminToken grants local admin (all platforms).
# 9531200, 9531210, 9531280 and 9531470 block known delivery shapes; this
# matches the target, so it still fires if a new CVE finds another way in.
# Same idea as CRS 930130 (restricted-files.data), which a plugin cannot
# extend; @pm is a case-insensitive substring match, so absolute paths,
# traversal, file:/media: references and Windows backslash paths all match.
#
SecRule REQUEST_FILENAME|ARGS|ARGS_NAMES "@pm .localadmintoken preferences.xml" \
    "id:9531290,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: request references a Plex secrets file',\
    logdata:'Matched %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ========================================================================
# Owner-only endpoint denies
# ========================================================================
#
# The owner administers the server on localhost or the LAN; shared users'
# clients never perform these operations. Three client-polled endpoints are
# split by method instead of denied outright (see 9531480).
#
# Deliberately NOT denied, because Plex enforces owner-only or per-account
# access on each (tested with a managed-user token, admin=0, one library):
#   /status/sessions   403 to shared tokens
#   /accounts          403 to shared tokens
#   /devices           403 to shared tokens
#   /statistics        per-account filtered (shared token: 200, empty)
#   GET /activities    per-account filtered (shared token: 200, empty);
#                      Plex Web and desktop clients poll it every session
#   GET /updater/status 403 to shared tokens; polled by Plex Web
#   GET /transcode/sessions/{id}  a client's own transcode status; polled
#                      during playback (observed 2026-09-28, Android TV)
#
# Denies match REQUEST_URI with t:urlDecodeUni and t:lowercase. No
# path-normalizing transform: on a Windows Coraza build normalizePathWin and
# normalizePath emit backslashes (Go filepath.Clean) and a forward-slash
# regex silently fails open. Instead every path regex in this file uses /+
# between segments, so //web or /system//agents still match, and 9531470
# drops traversal and dot segments. REQUEST_URI keeps the query string, so
# path anchors end in (?:[/?#]|$). Each rule uses "drop" (see Layout for a
# 403).


# ------------------------------------------------------------------------
# 9531400  Browser navigation to the root
# ------------------------------------------------------------------------
#
# Plex answers GET / from a browser with a 302 to /web/index.html, which
# reveals Plex Web before the /web deny fires on the redirect target.
# API clients also GET / (server capabilities) but send
# Accept: application/xml|json|*/*, never text/html.
#
SecRule REQUEST_URI "@rx ^/+(?:[?#]|$)" \
    "id:9531400,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: browser navigation to server root (owner-only surface)',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_HEADERS:Accept "@rx (?i)text/html" \
        "t:none"


# ------------------------------------------------------------------------
# 9531410  Plex Web UI bundle
# ------------------------------------------------------------------------
#
#   /web   XSS surface, plex.tv auth redirect
#
SecRule REQUEST_URI "@rx ^/+web(?:[/?#]|$)" \
    "id:9531410,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: Plex Web UI requested through shared-client proxy (owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"


# ------------------------------------------------------------------------
# 9531420  Token-returning endpoints
# ------------------------------------------------------------------------
#
#   /myplex        plex.tv link, returns owner token (CVE-2025-69414/69415)
#                  also closes lufinkey's un-CVE'd Issue 2A token retrieval
#   /connections   source connection info + tokens (same class)
#
SecRule REQUEST_URI "@rx ^/+(?:myplex|connections)(?:[/?#]|$)" \
    "id:9531420,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: token-returning endpoint requested (CVE-2025-69414/69415 class, owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"


# ------------------------------------------------------------------------
# 9531430  Server management endpoints
# ------------------------------------------------------------------------
#
#   /:/prefs              preferences read/write (CVE-2026-96656,
#                         legacy-pth-rce step 2)
#   /updater/check, /updater/apply   update check/apply (not /status)
#   /transcode/sessions   the full active-transcode list (collection only;
#                         per-id polling is handled by 9531480)
#   /butler               scheduled maintenance tasks
#   /system/notification  push notice to all clients
#   /diagnostics          DB dump and log bundle download
#   /services/browse      server filesystem listing
#   /log/networked        ship logs to remote collector
#   /media/grabbers       tuner hardware config
#   /servers              known server list, legacy discovery
#
SecRule REQUEST_URI "@rx ^/+(?:(?::/+prefs|butler|diagnostics|services/+browse|log/+networked|media/+grabbers|servers)(?:[/?#]|$)|updater/+(?:check|apply)(?:[/?#]|$)|system/+notification(?:[/?#]|$)|transcode/+sessions/*(?:[?#]|$))" \
    "id:9531430,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: server management endpoint requested (owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"


# ------------------------------------------------------------------------
# 9531440  Agent subsystem (unauthenticated)
# ------------------------------------------------------------------------
#
#   /system/agents   answers with NO token: agent list, Fix Match search,
#                    art fetch (CVE-2026-96651/96654; Zenofex legacy-pth-rce
#                    step 1, framework-rpc-injection,
#                    agentservice-symlink-read)
#
SecRule REQUEST_URI "@rx ^/+system/+agents(?:[/?#]|$)" \
    "id:9531440,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: unauthenticated agent endpoint requested (CVE-2026-96651/96654, owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"


# ------------------------------------------------------------------------
# 9531450  Server-side request proxy
# ------------------------------------------------------------------------
#
#   /system/proxy   fetches a caller-supplied URL from the server
#                   (CVE-2014-9304 SSRF). No shared-client use.
#
SecRule REQUEST_URI "@rx ^/+system/+proxy(?:[/?#]|$)" \
    "id:9531450,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: server-side proxy endpoint requested (CVE-2014-9304 SSRF, owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"


# ------------------------------------------------------------------------
# 9531460  Deprecated proxy request header
# ------------------------------------------------------------------------
#
#   X-Plex-Url   target URL for /system/proxy (CVE-2014-9304 SSRF). The
#                header exists only for that deprecated endpoint; no current
#                client sends it on any path. A request carrying it is a
#                probe by definition, so unlike the path denies above this
#                one is CRITICAL. Same class as 9531450.
#
SecRule &REQUEST_HEADERS:X-Plex-Url "@gt 0" \
    "id:9531460,\
    phase:1,\
    drop,\
    log,\
    t:none,\
    msg:'Plex: X-Plex-Url header (CVE-2014-9304 proxy SSRF vector, no legitimate client sends it)',\
    logdata:'%{REQUEST_HEADERS.X-Plex-Url}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL'"


# ------------------------------------------------------------------------
# 9531470  Traversal or backslash anywhere in the request URI
# ------------------------------------------------------------------------
#
# Stands in for the path normalization this file cannot use (see the
# denies intro). No legitimate Plex API path contains "..", a backslash or
# a "/./" segment, raw or percent-encoded, so any request whose path does
# is dropped. Matching stops at the first "?": query values legitimately
# hold both (Windows paths in /log messages, "..." in search text). Closes
# /library/../web, /web\..\ and /system/./notification style bypasses for
# every deny at once.
#
SecRule REQUEST_URI "@rx ^[^?]*(?:\.\.|\x5c|/\.(?:[/?#]|$))" \
    "id:9531470,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: path traversal or backslash in request URI (owner-only surface guard)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL'"


# ------------------------------------------------------------------------
# 9531480  Write method on a client-polled endpoint
# ------------------------------------------------------------------------
#
# Three endpoints are read by ordinary clients, so they are not path-denied,
# but each has an owner-only write on the same path:
#   GET /activities[/{id}]        progress poll     DELETE cancels the task
#   GET /transcode/sessions/{id}  own-session poll  DELETE ends the transcode
#   GET /updater/status           update state      no defined write
# Only GET, HEAD and OPTIONS are allowed (OPTIONS so a browser preflight
# from app.plex.tv is not dropped); every other verb is denied. No client
# has been seen sending one.
#
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" \
    "id:9531480,\
    phase:1,\
    drop,\
    log,\
    t:none,\
    msg:'Plex: write method on client-polled endpoint (owner-only surface)',\
    logdata:'%{REQUEST_METHOD} %{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_URI "@rx ^/+(?:activities(?:/+[^/?#]*)?|transcode/+sessions/+[^/?#]+|updater/+status)/*(?:[?#]|$)" \
        "t:none,t:urlDecodeUni,t:lowercase"


# ------------------------------------------------------------------------
# 9531490  Server-path and outbound-URL inputs on owner-only endpoints
# ------------------------------------------------------------------------
#
# These four operations take a server filesystem path or a URL the server
# will connect to, the input shape behind every real Plex vulnerability
# (CVE-2014-9304 /system/proxy; the 2026 file-read and SSRF CVEs):
#
#   POST /library/sections/all    locations[]=<server path>  (create library)
#   PUT  /library/sections/{id}   locations[]=<server path>  (edit library)
#   POST /playlists/upload        path=<server path>
#   POST /media/providers         url=<URL the server then reverse-proxies>
#
# Source: Plex OpenAPI spec v1.2.3. GET on these paths is ordinary client
# traffic and is not touched; nor are the owner writes made from phones
# (/library/sections/{id}/refresh, /library/sections/{id}/all, POST
# /playlists). (?i) because REQUEST_METHOD is the raw token the client sent.
# Plex already rejects non-owner tokens on all four (verified 2026-10-01),
# so this is a second lock; none has been seen from any client.
#
# Owner path: Settings via the allowlist (9531022) or with denies off.
#
SecRule REQUEST_METHOD "@rx (?i)^(?:post|put)$" \
    "id:9531490,\
    phase:1,\
    drop,\
    log,\
    t:none,\
    msg:'Plex: server-path or outbound-URL input on an owner-only endpoint',\
    logdata:'%{REQUEST_METHOD} %{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_URI "@rx ^/+(?:library/+sections/+(?:all|\d+)|playlists/+upload|media/+providers)/*(?:[?#]|$)" \
        "t:none,t:urlDecodeUni,t:lowercase"
