# OWASP CRS Plugin
# Plugin name: plex-hardening-plugin
# Plugin description: Rule exclusions Plex Media Server needs to run behind
#                     CRS, detection rules for Plex-specific attack classes,
#                     and owner-only endpoint denies for a shared-client proxy
# Rule ID block base: 9,530,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Documentation can be found here:
# https://github.com/davidscarth/plex-hardening-plugin

# Generic rule to disable plugin
SecRule TX:plex-hardening-plugin_enabled "@eq 0" "id:9530099,phase:1,pass,nolog,ctl:ruleRemoveById=9530100-9530999"

# Default values for configuration variables (see -config file). Each is
# only set when the variable does not exist yet, so the config file wins.
SecRule &TX:plex-hardening-plugin_endpoint_deny_enabled "@eq 0" "id:9530030,phase:1,pass,nolog,setvar:'tx.plex-hardening-plugin_endpoint_deny_enabled=1'"
SecRule &TX:plex-hardening-plugin_xfh_tripwire_enabled "@eq 0" "id:9530031,phase:1,pass,nolog,setvar:'tx.plex-hardening-plugin_xfh_tripwire_enabled=0'"

# Sub-gate: owner-only endpoint denies
SecRule TX:plex-hardening-plugin_endpoint_deny_enabled "@eq 0" "id:9530098,phase:1,pass,nolog,ctl:ruleRemoveById=9530300-9530399"


# ------------------------------------------------------------------------
# Layout
# ------------------------------------------------------------------------
#
#   9530100-9530199  Rule exclusions. Phase 1, ctl:ruleRemoveTargetById,
#                    each scoped to one endpoint and one parameter. Without
#                    these, CRS at PL1 breaks Plex playback and search, so
#                    they are part of hardening a deployment, not optional.
#   9530200-9530299  Detection rules. Anomaly-scored like CRS rules
#                    (tx.inbound_anomaly_score_pl1 += critical, i.e. one hit
#                    meets the default threshold). Honour SecDefaultAction
#                    via "block". All run in phase 2: rules in a -before file
#                    run ahead of CRS 901 initialisation in phase 1, where
#                    tx.critical_anomaly_score is not yet defined and any
#                    score referenced there is empty.
#   9530300-9530399  Owner-only endpoint denies. Explicit "drop" in phase 1,
#                    independent of anomaly scoring. To get a 403 instead of
#                    a closed connection, add to your after-file:
#                      SecRuleUpdateActionById 9530300-9530399 "deny,status:403"
#   9530500-9530999  Reserved for a future -after file (response rules),
#                    per the CRS plugin ID convention.
#
# All regexes are RE2-compatible (no lookaround, no backreferences) so the
# plugin runs unchanged on Coraza's default Go regexp engine and on
# ModSecurity/PCRE.
#
# Context: the post-incident review of a 2026 shared-user token compromise
# (five blocked owner-escalation attempts over three weeks) and the Zenofex
# Plex_Vuln_PoCs analysis.
# Plex Media Server >= 1.43.4 patches every CVE referenced below; the
# detection rules are defence-in-depth against regressions and variants.


# ========================================================================
# Rule exclusions
# ========================================================================
# ------------------------------------------------------------------------
# Notes for operators
# ------------------------------------------------------------------------
#
# All exclusions below were tuned against CRS 4.29.0 at PARANOIA LEVEL 1.
# At PL2 additional sibling rules inspect the same ARGS and the same Plex
# false positives can reappear. Only ARGS-scoped PL2 siblings are relevant;
# header-only PL2 rules (930121, 932131, 932239) never see these query
# parameters. Candidates, per rule:
#
#   9530100  ARGS:X-Plex-Client-Profile-Extra  + 932236, 932371
#            (also plausible: 932231, 932220, 932240, 932281)
#   9530110  ARGS:url                          + 931130, 932371
#   9530120  ARGS:message                      + 932371 (also 932236, 932271)
#
# Re-test with real Plex traffic at PL2 and add only the IDs that fire.
#
# Plex clients send most X-Plex-* values either as request headers or as
# query parameters. These exclusions cover the query-parameter form, which
# is what CRS inspects for the rule families involved.
#
# 9530130 (/media/grabbers) is only useful if tuner traffic is served
# through the proxy. With endpoint denies enabled (the default),
# /media/grabbers is dropped in phase 1 by 9530330 and 9530130 never
# matters.


# ------------------------------------------------------------------------
# Transcoder: X-Plex-Client-Profile-Extra vs. Unix RCE (932235)
# ------------------------------------------------------------------------
#
# Clients send add-transcode-target(...protocol=dash&...) and, on the
# /decision endpoint, longer profiles with add-limitation(...&replace=true)
# in the X-Plex-Client-Profile-Extra parameter on the universal transcoder.
# 932235 matches "=dash&" against its Unix command list; 932370 matches
# "&replace" as a Windows command-injection token. Both are the structured
# Plex client-profile DSL, not user input. Other 932 siblings may trip on
# future profile shapes; add them here as they appear.
#
# 932235 verified 2026-09-15; 932370 confirmed on a live Android TV
# transcode decision 2026-09-27, both against CRS 4.29.0.
#
SecRule REQUEST_FILENAME "@rx ^/(?:video|music)/:/transcode/universal/" \
    "id:9530100,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-hardening-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=932235;ARGS:X-Plex-Client-Profile-Extra,\
    ctl:ruleRemoveTargetById=932370;ARGS:X-Plex-Client-Profile-Extra"


# ------------------------------------------------------------------------
# Photo transcoder: url parameter vs. RFI (931100) and SSRF (934110)
# ------------------------------------------------------------------------
#
# Clients request thumbnails via
#   /photo/:/transcode?url=http://127.0.0.1:32400/library/metadata/...
# 931100 matches the IP-literal URL; 934110 matches 127.0.0.1 from ssrf.data.
#
# Verified 2026-09-15 against CRS 4.29.0.
#
SecRule REQUEST_FILENAME "@streq /photo/:/transcode" \
    "id:9530110,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-hardening-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=931100;ARGS:url,\
    ctl:ruleRemoveTargetById=934110;ARGS:url"


# ------------------------------------------------------------------------
# Client log upload: message parameter vs. Windows RCE (932370)
# ------------------------------------------------------------------------
#
# Clients ship their own log lines to /log?level=...&source=...&message=...
# The message is free text and trips 932370 on ordinary client output.
#
# Verified 2026-09-15 against CRS 4.29.0.
#
SecRule REQUEST_FILENAME "@streq /log" \
    "id:9530120,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-hardening-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=932370;ARGS:message"


# ------------------------------------------------------------------------
# HDHomeRun tuner discovery: uri parameter vs. RFI (931100)
# ------------------------------------------------------------------------
#
# /media/grabbers/tv.plex.grabbers.hdhomerun/devices?uri=http://<lan-ip>/...
# carries the tuner's LAN address, which 931100 treats as an RFI attempt.
#
# Note: set the tuner up from localhost rather than app.plex.tv, otherwise
# Plex fails to configure the built-in EPG during setup.
#
# Verified 2026-06-11 against CRS 4.27.0.
#
SecRule REQUEST_FILENAME "@beginsWith /media/grabbers/tv.plex.grabbers.hdhomerun/devices" \
    "id:9530130,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-hardening-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=931100;ARGS:uri"


# ------------------------------------------------------------------------
# Library search: query parameter vs. Unix RCE 2-3 chars (932230)
# ------------------------------------------------------------------------
#
# 932230 requires a shell wrapper or separator (time, env, eval, ;, |, =)
# followed later by a whole-word 2-3 char command (sh, ls, wc, df, ...) and
# a trailing delimiter. 932250 (direct Unix command execution) matches the
# same string and also shorter type-ahead searches ("sh movie",
# "ls la la land"), so both are excluded; with only 932230 removed, 932250
# fires next and "ls la la" typed into the Plex app crashed the client
# (observed in production 2026-09-26). 932260, the 2-3 char sibling, does
# not match any of these and is left in place. Plex fans each search out
# to /library/search and /tv.plex.providers.<provider>/library/search, so
# the regex covers both.
#
# Verified 2026-09-26 against CRS 4.29.0.
#
SecRule REQUEST_FILENAME "@rx ^(?:/tv\.plex\.providers\.[^/]+)?/library/search$" \
    "id:9530140,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-hardening-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=932230;ARGS:query,\
    ctl:ruleRemoveTargetById=932250;ARGS:query"


# ------------------------------------------------------------------------
# Session terminate: sessionId parameter name vs. session fixation
# (943110, 943120)
# ------------------------------------------------------------------------
#
# The owner's "stop playback" control sends ?sessionId=<playback key>&reason=.
# Both rules key on the parameter NAME (ARGS_NAMES, t:lowercase), so the
# target is ARGS_NAMES. 943120 fires when there is no Referer (native apps);
# 943110 fires with an off-domain Referer (Plex Web sends app.plex.tv).
# sessionId here is a playback identifier, not an auth session, and the
# endpoint is owner-only (403 to shared tokens).
#
# Verified 2026-09-26 against CRS 4.29.0.
#
SecRule REQUEST_FILENAME "@streq /status/sessions/terminate" \
    "id:9530150,\
    phase:1,\
    pass,\
    nolog,\
    ver:'plex-hardening-plugin/1.0.0',\
    ctl:ruleRemoveTargetById=943110;ARGS_NAMES:sessionId,\
    ctl:ruleRemoveTargetById=943120;ARGS_NAMES:sessionId"


# ========================================================================
# Detection rules
# ========================================================================

# ------------------------------------------------------------------------
# 9530200  file:// scheme in a url parameter
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96651 / Zenofex metadata-file-read (CWE-36, CWE-73).
# /library/metadata/{id}/file accepts url=; legitimate requests use
# media:// references. Vulnerable builds accepted file:// and returned
# arbitrary server-side files (Preferences.xml, .LocalAdminToken, the
# library DB). Any valid session token was enough.
#
# CRS gap: 931130 covers file:// but is PL2. 931100 (PL1) requires an IP
# literal after the scheme, so file:///path passes.
#
# Deliberately not scoped to the metadata endpoint: the photo transcoder
# (/photo/:/transcode?url=) is the same fetch-a-URL class, and the
# exclusion 9530110 removes ARGS:url from 931100/934110 there.
#
SecRule ARGS:url "@rx (?i)^\s*file:" \
    "id:9530200,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: file:// scheme in url parameter (CVE-2026-96651, metadata-file-read)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530210  Traversal inside a media:// reference on the metadata file endpoint
# ------------------------------------------------------------------------
#
# The exact shape seen in the incident that produced this plugin (five
# attempts over three weeks, all caught
# by 930100):
#   GET /library/metadata/{id}/file?url=media://../../Preferences.xml
# 930100 already blocks this; this rule is a Plex-labelled backstop so the
# event is attributable even if 930100 is ever excluded on this path, and
# so it can drive a CrowdSec scenario on a single ID.
#
SecRule REQUEST_FILENAME "@rx ^/library/metadata/[0-9]+/file$" \
    "id:9530210,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Plex: path traversal in metadata file reference (CVE-2026-96651, observed in the wild)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:url "@rx (?:^|[\x5c/])\.\.(?:[\x5c/]|$)" \
        "t:none,t:urlDecodeUni,\
        setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530220  Encode/decode flag injection in a client profile augmentation
# ------------------------------------------------------------------------
#
# Addresses: Zenofex profile-extra-rce (CWE-88, CWE-94, CWE-73).
# X-Plex-Client-Profile-Extra accepts add-transcode-target-settings()
# directives. Vulnerable builds allowed VideoEncodeFlags to inject
# arbitrary FFmpeg/x264 arguments, giving .pth placement and delayed RCE
# as the Plex service account. Plex's fix is an allowlist ("ClientProfileExtra:
# ignoring transcode target setting %s, which may not be set from a profile
# augmentation"), so the exact set of settings that reach the encoder is
# not known from the outside. Any setting ending in Flags in a profile
# augmentation is encoder-argument territory, so the whole family is
# matched rather than the four known names. This tracks known dangerous
# settings; it is defence-in-depth on a patched CVE, not a substitute for
# the patch.
#
# CRS gap: the 932 family inspects ARGS and cookies, not custom headers.
# Plex accepts X-Plex-* in either position, so both are inspected here.
# The exclusion 9530100 removes ARGS:X-Plex-Client-Profile-Extra from
# 932235 only; this rule is unaffected.
#
SecRule REQUEST_HEADERS:X-Plex-Client-Profile-Extra|ARGS:X-Plex-Client-Profile-Extra "@rx (?i)\w*flags=" \
    "id:9530220,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: encode/decode flag injection in client profile augmentation (profile-extra-rce)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-rce',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/152/248/88',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530230  URL scheme in the transcoder path parameter
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96655. /video/:/transcode/universal accepted a full
# URL in the path parameter and fetched it (SSRF). Fixed in 10861.
# Legitimate clients always pass a library reference (/library/metadata/{id},
# /library/parts/...), never a scheme. Any scheme here is an attack, and
# so is a protocol-relative reference (//host/path), which has no scheme
# but still names a remote host.
#
SecRule REQUEST_FILENAME "@rx ^/(?:video|music)/:/transcode/universal/" \
    "id:9530230,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Plex: URL scheme in transcoder path parameter (CVE-2026-96655)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/225/115/664',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:path "@rx ^(?:[a-z][a-z0-9+.-]*:|/)/" \
        "t:none,t:urlDecodeUni,t:lowercase,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530240  Non-http(s) protocol on Companion subscribe
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96652 / Zenofex companion-proxy-ssrf (CWE-918).
# /player/timeline/subscribe takes protocol=http or protocol=https and
# nothing else; Plex's 10861 fix enforces exactly that ("wanted to
# subscribe with an unsupported protocol '%s'"). The SSRF put a full URL
# here. /player/* stays open for Companion traffic; only this parameter's
# shape is enforced. protocol=dash / protocol=hls on the transcoder is
# out of scope by the exact path match.
#
SecRule REQUEST_FILENAME "@streq /player/timeline/subscribe" \
    "id:9530240,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Plex: non-http(s) protocol on Companion subscribe (CVE-2026-96652, companion-proxy-ssrf)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/225/115/664',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:protocol "!@rx ^https?$" \
        "t:none,t:urlDecodeUni,t:lowercase,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530250  File-write shape in a transcoder preference
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96656 / Zenofex network-transcoder-preference and
# the legacy-pth-rce chain. TranscoderH264Options is appended verbatim to
# x264's option string. The PoC used stats= (names an output file) plus a
# newline to inject a second line, which is how the .pth payload is
# placed; tcfile-out= and other options also name files. Rather than
# enumerate option names, any path separator or line break in the value
# is blocked: no legitimate x264 tuning value (ref=2:bframes=3) contains
# / or \, only options that name files do.
#
# Backstop for /:/prefs, which 9530330 drops when endpoint denies are on;
# active protection on deployments without the deny.
#
SecRule REQUEST_FILENAME "@streq /:/prefs" \
    "id:9530250,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Plex: file-write shape in transcoder preference (CVE-2026-96656, network-transcoder-preference)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-rce',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/152/248/88',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:/^Transcoder.*Options(?:Override)?$/ "@rx [/\x5c\r\n]" \
        "t:none,t:urlDecodeUni,\
        setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530260  Path characters in an agent identifier
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96654 / Zenofex framework-rpc-injection and the
# legacy-pth-rce chain. Agent identifiers are reverse-DNS names
# (com.plexapp.agents.localmedia, tv.plex.agents.movie): letters, digits,
# dots. The RPC injection put a slash-delimited route and a # fragment in
# the identifier parameter; the legacy chain put ../ in it.
#
# Backstop for /system/agents, which 9530340 drops when endpoint denies
# are on (the endpoint answers without a token).
#
SecRule REQUEST_FILENAME "@beginsWith /system/agents/" \
    "id:9530260,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Plex: path characters in agent identifier (CVE-2026-96654, framework-rpc-injection)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-injection-generic',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/152/137/6',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:identifier "@rx [/\x5c#]" \
        "t:none,t:urlDecodeUni,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530270  Forwarding header at the edge (opt-in detection signal)
# ------------------------------------------------------------------------
#
# At a first-hop proxy nothing legitimate sets X-Forwarded-Host on inbound
# requests; presence means a client is probing with proxy-header spoofing.
# Scores WARNING (3 by default): below the blocking threshold on its own,
# visible in logs, usable as an alerting signal.
#
# X-Forwarded-For is deliberately not matched: some VPN and proxy services
# inject it on ordinary traffic and a shared user behind one would be hit.
#
# Enabled via tx.plex-hardening-plugin_xfh_tripwire_enabled=1 (see -config file).
#
SecRule TX:plex-hardening-plugin_xfh_tripwire_enabled "@eq 1" \
    "id:9530270,\
    phase:2,\
    block,\
    t:none,\
    msg:'Plex: X-Forwarded-Host supplied by client at edge proxy',\
    logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-protocol',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/118/169',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx ." \
        "t:none,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# ------------------------------------------------------------------------
# 9530280  Unsupported media reference on the metadata file endpoint
# ------------------------------------------------------------------------
#
# Addresses: CVE-2026-96651 / Zenofex metadata-file-read, allowlist form.
# Plex's 10896 fix logs "[Library] Rejecting metadata file request for
# unsupported media reference: %s", i.e. the endpoint only accepts Plex's
# own reference schemes. Anything else (file:, http:, gopher:, a bare
# path) is rejected here regardless of what 9530200/9530210 catch.
#
# Untested against production traffic as of this release; see README.
# media:// is the reference seen in client traffic on this endpoint;
# metadata:// and upload:// are Plex's other bundle-reference schemes and
# are included so artwork references are not blocked. Trim if your traffic
# shows only media://.
#
SecRule REQUEST_FILENAME "@rx ^/library/metadata/[0-9]+/file$" \
    "id:9530280,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Plex: unsupported media reference on metadata file endpoint (CVE-2026-96651, metadata-file-read)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:url "!@rx (?i)^(?:media|metadata|upload)://" \
        "t:none,t:urlDecodeUni,t:trim,\
        setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ========================================================================
# Owner-only endpoint denies
# ========================================================================
#
# Rationale: the owner administers the server on localhost; shared users'
# clients never perform these operations. Two endpoints are split by
# method because clients do call them routinely: GET /activities (progress
# poll, per-account filtered by Plex) and GET /updater/status (403 to shared
# tokens) are allowed, while DELETE /activities/{id} (cancel a server task)
# is denied by 9530380 and /updater/check + /updater/apply by 9530330.
#
# Deliberately NOT denied, because Plex enforces owner-only or per-account
# access on each (tested with a managed-user token, admin=0, one library):
#   /status/sessions   403 to shared tokens
#   /accounts          403 to shared tokens
#   /devices           403 to shared tokens
#   /statistics        per-account filtered (shared token: 200, empty)
#   GET /activities    per-account filtered (shared token: 200, empty);
#                      Plex Web and desktop clients poll it every session
#   GET /updater/status 403 to shared tokens; polled by Plex Web
#
# Target and transforms. Denies match REQUEST_URI with t:urlDecodeUni and
# t:lowercase. No path-normalising transform: on a Windows Coraza build
# normalisePathWin/normalizePath emit backslashes (Go filepath.Clean) and a
# forward-slash regex silently fails open. Traversal is handled by 9530370.
# REQUEST_URI keeps the query string, so path anchors end in (?:[/?#]|$).
#
# Each rule uses "drop". See the Layout section for how to turn that into
# a 403.

# 9530300  Browser navigation to the root
#
# Plex answers GET / from a browser with a 302 to /web/index.html, which
# reveals Plex Web before the /web deny fires on the redirect target.
# API clients also GET / (server capabilities) but send
# Accept: application/xml|json|*/*, never text/html.
#
SecRule REQUEST_URI "@rx ^/+(?:[?#]|$)" \
    "id:9530300,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: browser navigation to server root (owner-only surface)',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_HEADERS:Accept "@rx (?i)text/html" \
        "t:none"

# 9530310  Plex Web UI bundle
#   /web   XSS surface, plex.tv auth redirect
#
SecRule REQUEST_URI "@rx ^/web(?:[/?#]|$)" \
    "id:9530310,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: Plex Web UI requested through shared-client proxy (owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"

# 9530320  Token-returning endpoints
#   /myplex        plex.tv link, returns owner token (CVE-2025-69414/69415)
#                  also closes lufinkey's un-CVE'd Issue 2A token retrieval
#   /connections   source connection info + tokens (same class)
#
SecRule REQUEST_URI "@rx ^/(?:myplex|connections)(?:[/?#]|$)" \
    "id:9530320,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: token-returning endpoint requested (CVE-2025-69414/69415 class, owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"

# 9530330  Server management endpoints
#   /:/prefs              preferences read/write (CVE-2026-96656, legacy-pth-rce step 2)
#   /updater/check, /updater/apply   update check/apply. /updater/status is
#                         NOT denied: Plex Web polls it every session and
#                         Plex itself answers 403 to shared tokens.
#   /transcode/sessions   active transcodes, kill switch
#   /butler               scheduled maintenance tasks
#   /system/notification  push notice to all clients (exact path)
#   /diagnostics          DB dump and log bundle download
#   /services/browse      server filesystem listing
#   /log/networked        ship logs to remote collector
#   /media/grabbers       tuner hardware config
#   /servers              known server list, legacy discovery
#
SecRule REQUEST_URI "@rx ^/(?:(?::/prefs|transcode/sessions|butler|diagnostics|services/browse|log/networked|media/grabbers|servers)(?:[/?#]|$)|updater/(?:check|apply)(?:[/?#]|$)|system/notification(?:[?#]|$))" \
    "id:9530330,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: server management endpoint requested (owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"

# 9530340  Agent subsystem (unauthenticated)
#   /system/agents   answers with NO token: agent list, Fix Match search,
#                    art fetch (CVE-2026-96651/96654, Zenofex legacy-pth-rce
#                    step 1, framework-rpc-injection, agentservice-symlink-read)
#
SecRule REQUEST_URI "@rx ^/system/agents(?:[/?#]|$)" \
    "id:9530340,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: unauthenticated agent endpoint requested (CVE-2026-96651/96654, owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"

# 9530350  Server-side request proxy
#   /system/proxy   fetches a caller-supplied URL from the server
#                   (CVE-2014-9304 SSRF). No shared-client use.
#
SecRule REQUEST_URI "@rx ^/system/proxy(?:[/?#]|$)" \
    "id:9530350,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Plex: server-side proxy endpoint requested (CVE-2014-9304 SSRF, owner-only surface)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING'"

# 9530360  Deprecated proxy request header
#   X-Plex-Url   target URL for /system/proxy (CVE-2014-9304 SSRF). The
#                header exists only for that deprecated endpoint; no current
#                client sends it on any path. A request carrying it is a
#                probe by definition, so unlike the path denies above this
#                one is CRITICAL. Same class as 9530350.
#
SecRule &REQUEST_HEADERS:X-Plex-Url "@gt 0" \
    "id:9530360,\
    phase:1,\
    drop,\
    log,\
    t:none,\
    msg:'Plex: X-Plex-Url header (CVE-2014-9304 proxy SSRF vector, no legitimate client sends it)',\
    logdata:'%{REQUEST_HEADERS.X-Plex-Url}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-ssrf',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL'"

# 9530370  Traversal or backslash anywhere in the request URI
#
# Replaces the path-collapsing that normalisePathWin was meant to provide
# (see the note above on why that transform is unusable on a Windows
# Coraza build). No legitimate Plex API path contains ".." or a backslash,
# so any request whose path carries either, raw or percent-encoded, is
# dropped. Matching stops at the first "?": query values legitimately hold
# both (Windows paths in /log messages, "..." in search text). This closes /library/../web and
# /web\..\ style bypasses for every deny at once, on every engine and OS.
#
SecRule REQUEST_URI "@rx ^[^?]*(?:\.\.|\x5c)" \
    "id:9530370,\
    phase:1,\
    drop,\
    log,\
    t:none,t:urlDecodeUni,\
    msg:'Plex: path traversal or backslash in request URI (owner-only surface guard)',\
    logdata:'%{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153/126',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'CRITICAL'"

# 9530380  Cancel a server activity
#   DELETE /activities/{id}   cancels a running server task (library scan,
#                             refresh, optimize). GET /activities is the
#                             harmless progress poll and is allowed.
#
SecRule REQUEST_METHOD "@streq DELETE" \
    "id:9530380,\
    phase:1,\
    drop,\
    log,\
    t:none,\
    msg:'Plex: server activity cancel requested (owner-only surface)',\
    logdata:'%{REQUEST_METHOD} %{REQUEST_URI}',\
    tag:'application-plex',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'plex-hardening-plugin',\
    tag:'plex-hardening-plugin/endpoint-deny',\
    ver:'plex-hardening-plugin/1.0.0',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_URI "@rx ^/activities(?:/[^/?#]+)?(?:[?#]|$)" \
        "t:none,t:urlDecodeUni,t:lowercase"
